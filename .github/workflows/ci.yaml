name: CI
"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read, pull-requests: read}
jobs:
  test:
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    uses: UncleThreeHomeLab/yasai-cloudlab/.github/workflows/application-test.yaml@ee5085e793a42803305d6f5a4f5a34873453363a
    with:
      application: notes
