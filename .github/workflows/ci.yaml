name: CI eligibility probe
"on":
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, synchronize]
permissions: {contents: read, pull-requests: read}
jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: cloudlab-notes
    timeout-minutes: 2
    steps:
      - name: Unapproved sentinel must never start
        run: echo CLOUDLAB_UNAPPROVED_CODE_EXECUTED
